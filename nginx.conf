server {
    listen       80;
    server_name  _;

    # VitePress 构建后的静态文件目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 访问日志/错误日志（可按需调整或关闭）
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 访问根路径时，重定向到 /blog/
    location = / {
        return 301 /blog/;
    }

    # 静态资源：必须命中真实文件，找不到就 404，不要回退到 index.html
    location ~* ^/blog/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 其他以 /blog/ 开头的请求（前端路由），回退到 SPA 的 index.html
    # 注意这里用 /blog/index.html，保持 base=/blog/ 的路径一致
    location /blog/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /blog/index.html;
    }

    # 健康检查
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}


