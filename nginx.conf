server {
    listen       80;
    server_name  _;

    # VitePress 构建后的静态文件目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 访问日志/错误日志（可按需调整或关闭）
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 访问根路径时，重定向到 /blog/
    location = / {
        return 301 /blog/;
    }

    # 所有以 /blog/ 开头的请求，移除 /blog/ 前缀后再去当前目录查找文件
    # 例如：/blog/index.html -> /usr/share/nginx/html/index.html
    location /blog/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # 可选：为单独的资源路径设置缓存策略（同样基于 /blog/ 前缀）
    location ~* ^/blog/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        alias /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}


