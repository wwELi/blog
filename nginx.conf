server {
    listen       80;
    server_name  _;

    # VitePress 构建后的静态文件目录
    root   /usr/share/nginx/html;
    index  index.html;

    # 访问日志/错误日志（可按需调整或关闭）
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 访问根路径时，重定向到 /blog/
    location = / {
        return 301 /blog/;
    }

    # 静态资源：/blog/... 前缀会被移除后再映射到磁盘
    # /blog/assets/style.css -> /usr/share/nginx/html/assets/style.css
    location ~* ^/blog/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        alias /usr/share/nginx/html/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 其他以 /blog/ 开头的请求（前端路由），找不到实际文件时回退到 index.html
    # /blog/xxx -> /usr/share/nginx/html/index.html（VitePress base=/blog/）
    location /blog/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}


